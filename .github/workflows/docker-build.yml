name: Docker Build and Push to GitLab

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitLab Container Registry
        run: |
          echo "${{ secrets.CI_REGISTRY_PASSWORD }}" | docker login registry.gitlab.com -u "${{ secrets.CI_REGISTRY_USER }}" --password-stdin

      - name: Build Docker Image
        run: |
          IMAGE_NAME="registry.gitlab.com/<your-namespace>/<your-repository>"
          docker build -t "$IMAGE_NAME:${{ github.sha }}" .
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Clean up local Docker images
        if: always()
        run: |
          docker rmi "$IMAGE_NAME:${{ github.sha }}" || true
          docker rmi "$IMAGE_NAME:latest" || true
